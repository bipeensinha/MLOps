<!DOCTYPE html>
<html>

<head>

    <title>Pune Weather Prediction</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f6fa;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            font-size: 30px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🌤 Pune Weather</h1>

    <p>ML Rain Prediction</p>


    <form action="/predict" method="POST">

        <input
            type="number"
            step="0.1"
            name="temperature"
            placeholder="Temperature °C"
            required
        >

        <input
            type="number"
            step="0.1"
            name="humidity"
            placeholder="Humidity %"
            required
        >

        <input
            type="number"
            step="0.1"
            name="wind_speed"
            placeholder="Wind Speed km/h"
            required
        >

        <br>

        <button type="submit">
            Predict Weather
        </button>

    </form>


    {% if result %}

        <div class="result">

            {{ emoji }} {{ result }}

        </div>

    {% endif %}

</div>

</body>

</html>
